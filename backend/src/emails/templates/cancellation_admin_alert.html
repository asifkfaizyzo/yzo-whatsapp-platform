<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Alert: Tenant Cancelled</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f9fafb; padding: 20px;">
  <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #e5e7eb;">
    <h2 style="color: #dc2626; margin-top: 0;">Super Admin Alert: Tenant Cancellation</h2>
    <p>A tenant has cancelled their active subscription. See the details below:</p>
    
    <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
      <tr style="border-bottom: 1px solid #e5e7eb;">
        <td style="padding: 10px 0; font-weight: bold; color: #4b5563;">Company Name:</td>
        <td style="padding: 10px 0; color: #111827;">{{companyName}}</td>
      </tr>
      <tr style="border-bottom: 1px solid #e5e7eb;">
        <td style="padding: 10px 0; font-weight: bold; color: #4b5563;">Email:</td>
        <td style="padding: 10px 0; color: #111827;">{{email}}</td>
      </tr>
      <tr style="border-bottom: 1px solid #e5e7eb;">
        <td style="padding: 10px 0; font-weight: bold; color: #4b5563;">Plan:</td>
        <td style="padding: 10px 0; color: #111827;">{{planName}}</td>
      </tr>
      <tr style="border-bottom: 1px solid #e5e7eb;">
        <td style="padding: 10px 0; font-weight: bold; color: #4b5563;">Cancellation Reason:</td>
        <td style="padding: 10px 0; color: #111827; font-weight: bold;">{{reason}}</td>
      </tr>
      <tr style="border-bottom: 1px solid #e5e7eb;">
        <td style="padding: 10px 0; font-weight: bold; color: #4b5563;">Additional Comment:</td>
        <td style="padding: 10px 0; color: #111827;">{{comment}}</td>
      </tr>
      <tr style="border-bottom: 1px solid #e5e7eb;">
        <td style="padding: 10px 0; font-weight: bold; color: #4b5563;">Period End Date:</td>
        <td style="padding: 10px 0; color: #111827;">{{periodEndDate}}</td>
      </tr>
    </table>
  </div>
</body>
</html>

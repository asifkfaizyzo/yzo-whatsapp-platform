version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: sudoreply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yzoadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Sibilissy@5453}
      POSTGRES_DB: ${POSTGRES_DB:-fullweb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yzoadmin} -d ${POSTGRES_DB:-fullweb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          memory: 512M

  # ==========================================
  # 2. Redis Cache & Queue Service
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: sudoreply-redis
    restart: unless-stopped
    command: redis-server --maxmemory 2gb --maxmemory-policy noeviction --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          memory: 256M

  # ==========================================
  # 3. Node.js Backend API & Workers
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sudoreply-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - NODE_OPTIONS=--max-old-space-size=2048
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - backend_uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
        reservations:
          memory: 512M

  # ==========================================
  # 4. Admin Web Frontend (Nginx SPA)
  # ==========================================
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: sudoreply-admin-web
    restart: unless-stopped
    env_file:
      - ./admin-web/.env
    ports:
      - "${ADMIN_WEB_PORT:-3001}:80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M

  # ==========================================
  # 5. Tenant Web Frontend (Nginx SPA)
  # ==========================================
  tenant-web:
    build:
      context: ./tenant-web
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
        VITE_META_APP_ID: ${VITE_META_APP_ID}
        VITE_META_CONFIG_ID: ${VITE_META_CONFIG_ID}
        VITE_APP_URL: ${VITE_APP_URL}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: sudoreply-tenant-web
    restart: unless-stopped
    env_file:
      - ./tenant-web/.env
    ports:
      - "${TENANT_WEB_PORT:-3002}:80"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 64M

# Persistent Named Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local

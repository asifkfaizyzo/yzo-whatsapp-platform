version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sudoreply-postgres
    restart: always
    environment:
      POSTGRES_USER: yzoadmin
      POSTGRES_PASSWORD: Sibilissy@5453
      POSTGRES_DB: fullweb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yzoadmin -d fullweb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & BullMQ Queue Server
  redis:
    image: redis:7-alpine
    container_name: sudoreply-redis
    restart: always
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Node.js Backend API & Workers
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sudoreply-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yzoadmin}:${POSTGRES_PASSWORD:-Sibilissy@5453}@postgres:5432/${POSTGRES_DB:-fullweb}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 5000
      FRONTEND_URLS: ${FRONTEND_URLS:-https://sudoreply.com,https://www.sudoreply.com,https://admin.sudoreply.com}
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  # 4. Tenant React Web App (sudoreply.com / www.sudoreply.com)
  tenant-web:
    build:
      context: ./tenant-web
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-https://api.sudoreply.com}
        VITE_API_URL: ${VITE_API_URL:-https://api.sudoreply.com}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-https://api.sudoreply.com}
    container_name: sudoreply-tenant-web
    restart: always
    ports:
      - "3002:80"

  # 5. Admin React Web App (admin.sudoreply.com)
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.sudoreply.com}
    container_name: sudoreply-admin-web
    restart: always
    ports:
      - "3001:80"

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

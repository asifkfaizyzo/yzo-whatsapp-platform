<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completing WhatsApp Connection...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      max-width: 360px;
      width: 90%;
    }
    .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    h2 { color: #1a1a2e; font-size: 1.2rem; margin-bottom: 0.5rem; }
    p { color: #666; font-size: 0.9rem; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #e0e0e0;
      border-top-color: #25d366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1rem auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h2>Completing WhatsApp Connection</h2>
    <p>This window will close automatically...</p>
    <div class="spinner"></div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code  = params.get('code');
      var state = params.get('state');
      var error = params.get('error');

      var payload = {
        type:  'WA_OAUTH_CALLBACK',
        code:  code  || null,
        state: state || null,
        error: error || null,
      };

      if (window.opener && !window.opener.closed) {
        // Send code to parent window (same origin)
        window.opener.postMessage(payload, window.location.origin);
        // Close popup after short delay so the message is processed
        setTimeout(function () { window.close(); }, 800);
      } else {
        // Opened directly (not as a popup) — redirect to dashboard
        window.location.href = '/dashboard';
      }
    })();
  </script>
</body>
</html>
